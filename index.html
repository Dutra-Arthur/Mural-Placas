<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mural de Placas de Formatura</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-wrapper">
    <header class="page-header">
      <div>
        <h1>Mural de Placas de Formatura</h1>
        <p>Visualize as placas de turmas de formandos.</p>
      </div>
      <a href="login.html" class="admin-link">Área administrativa</a>
    </header>

    <section class="content-grid">
      <article class="mural-panel">
        <div class="page-actions">
          <a href="login.html?redirect=home.html" class="secondary-link discreet-button">Adicionar nova placa</a>
        </div>

        <div class="mural-header">
          <h2>Placas no mural</h2>
          <span id="placasCount">0 placas</span>
        </div>

        <form id="filtrosPlacas" class="placa-filters" role="search">
          <label class="filter-field">
            <span>Buscar</span>
            <input type="search" id="buscaPlaca" placeholder="Curso ou nome da turma" />
          </label>
          <label class="filter-field">
            <span>Curso</span>
            <select id="filtroCurso">
              <option value="">Todos os cursos</option>
            </select>
          </label>
          <label class="filter-field">
            <span>Ano/Semestre</span>
            <select id="filtroAno">
              <option value="">Todos os períodos</option>
            </select>
          </label>
          <button type="button" id="limparFiltros" class="filter-clear">Limpar filtros</button>
        </form>

        <div id="mural" class="mural-grid"></div>
      </article>
    </section>
  </main>

  <script type="module" src="mural.js" defer></script>
</body>
</html>
